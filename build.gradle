plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = '1.0.0'
group = 'net.minlauncher'

base {
    archivesName = 'MinLauncher-Client'
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    // Minecraft 26.1.2 + Mojang Official Mappings (no existe Yarn para 26.x)
    minecraft "com.mojang:minecraft:26.1.2"

    // Fabric Loader y Fabric API para 26.1.2 (namespace Mojang, jar pre-nombrado)
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2"

    // Librerías de utilidades
    implementation 'com.google.code.gson:gson:2.11.0'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}